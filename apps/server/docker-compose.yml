services:
  redis:
    image: redis:7-alpine
    container_name: vulms_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - vulms_network

  evolution_api:
    image: evoapicloud/evolution-api:latest
    container_name: evolution_api
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - SERVER_URL=http://localhost:8080
      - DOCKER_ENV=true
      - TZ=Asia/Karachi
      - AUTHENTICATION_TYPE=apikey
      - AUTHENTICATION_API_KEY=${EVOLUTION_API_KEY:-@Docker_123}
      - DATABASE_ENABLED=true
      - DATABASE_PROVIDER=postgresql
      - DATABASE_CONNECTION_URI=${DATABASE_URL}
      - CACHE_REDIS_ENABLED=true
      - CACHE_REDIS_URI=redis://redis:6379/1
      - LOG_LEVEL=ERROR,WARN,INFO
    volumes:
      - evolution_instances:/evolution/instances
    depends_on:
      - redis
    networks:
      - vulms_network

  vulms_gateway:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vulms_gateway
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=redis://redis:6379/0
      - EVOLUTION_API_URL=http://evolution_api:8080
      - EVOLUTION_API_KEY=${EVOLUTION_API_KEY:-@Docker_123}
      - EVOLUTION_INSTANCE=${EVOLUTION_INSTANCE:-vulms_bot}
      - VULMS_ENCRYPTION_KEY=${VULMS_ENCRYPTION_KEY}
      - LOG_LEVEL=INFO
      - APP_CACHE_DIR=/tmp/vulms_cache
    volumes:
      - .:/app
    depends_on:
      - redis
      - evolution_api
    networks:
      - vulms_network
    command: uvicorn main:app --host 0.0.0.0 --port 8000

networks:
  vulms_network:
    driver: bridge

volumes:
  evolution_instances:
    driver: local
  redis_data:
    driver: local