<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#242424" />
      <stop offset="100%" stop-color="#0a0a0a" />
    </radialGradient>

    <!-- Outer Triangle Glowing Neon Edge -->
    <linearGradient id="neonEdge" x1="0%" y1="100%" x2="50%" y2="0%">
      <stop offset="0%" stop-color="#050014" />
      <stop offset="70%" stop-color="#9d00ff" />
      <stop offset="100%" stop-color="#ff00bb" />
    </linearGradient>

    <!-- Inner Triangle Base Gradient -->
    <linearGradient id="innerTri" x1="0%" y1="100%" x2="50%" y2="0%">
      <stop offset="0%" stop-color="#0f021a" />
      <stop offset="100%" stop-color="#2b0054" />
    </linearGradient>

    <!-- Metallic Base Reflection (Left Side) -->
    <linearGradient id="metalLeft" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2c2536" />
      <stop offset="50%" stop-color="#695c7d" />
      <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>

    <!-- Metallic Base Reflection (Right Side) -->
    <linearGradient id="metalRight" x1="100%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#1b1624" />
      <stop offset="50%" stop-color="#463c54" />
      <stop offset="100%" stop-color="#b8b0c4" />
    </linearGradient>

    <!-- Blur effect for depth -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="url(#bgGrad)" />

  <!-- Triangle Structure Container -->
  <g transform="translate(0, 80)">
    
    <!-- 1. Outer Glowing Neon Triangle Frame -->
    <polygon points="400,150 160,540 640,540" fill="none" stroke="url(#neonEdge)" stroke-width="14" filter="url(#neonGlow)" />

    <!-- 2. Dark Inner Core Triangle -->
    <polygon points="400,168 180,530 620,530" fill="url(#innerTri)" />

    <!-- 3. Lower Nested Metallic Layer (3D Peak Structure) -->
    <!-- Left Metallic Face -->
    <polygon points="400,430 250,540 400,540" fill="url(#metalLeft)" />
    
    <!-- Right Metallic Face -->
    <polygon points="400,430 550,540 400,540" fill="url(#metalRight)" />

    <!-- Sharp Center Crest Line for 3D Definition -->
    <line x1="400" y1="430" x2="400" y2="540" stroke="#ffffff" stroke-width="1.5" opacity="0.7" />
    
  </g>
</svg>
